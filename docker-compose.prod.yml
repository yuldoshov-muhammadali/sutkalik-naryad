# Production: web (gunicorn) + PostgreSQL + Caddy (avtomatik HTTPS) + kunlik zaxira.
# Ishga tushirish (batafsil: docs/joylashtirish.md):
#   cp .env.prod.example .env      # qiymatlarni to'ldiring
#   docker compose -f docker-compose.prod.yml up -d --build
name: sutkalik-naryad

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-naryad}
  POSTGRES_USER: ${POSTGRES_USER:-naryad}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilmagan}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  web:
    build: .
    image: sutkalik-naryad:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_prod
      DATABASE_URL: postgres://${POSTGRES_USER:-naryad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-naryad}
      DJANGO_LOG_DIR: /app/logs
    volumes:
      - logs:/app/logs
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env da berilmagan}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-naryad}
      PGUSER: ${POSTGRES_USER:-naryad}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TZ: Asia/Tashkent
    entrypoint: ["sh", "/scripts/backup.sh", "--har-kuni"]
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -U $${PGUSER}"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  pgdata:
  logs:
  caddy_data:
  caddy_config:
