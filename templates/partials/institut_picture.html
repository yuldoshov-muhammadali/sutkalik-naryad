{% load static i18n %}{# Institut binosi: telefonda 960 px, kompyuterda 1920 px (webp, jpg zaxira) #}
<picture>
  <source type="image/webp" srcset="{% static 'img/institut-960.webp' %} 960w, {% static 'img/institut-1920.webp' %} 1920w" sizes="100vw">
  <img src="{% static 'img/institut-1920.jpg' %}" srcset="{% static 'img/institut-960.jpg' %} 960w, {% static 'img/institut-1920.jpg' %} 1920w" sizes="100vw"
       width="1920" height="1080" alt="{% translate "Bojxona instituti binosi" %}" fetchpriority="high" decoding="async" data-testid="institut-img"
       class="{{ img_class }}">
</picture>
