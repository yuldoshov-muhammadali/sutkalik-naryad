{% load i18n %}{% get_current_language as current_lang %}
{# Til tanlash (59-band): har til o‘z nomi bilan — tarjima qilinmaydi #}
<form method="post" action="{% url 'set_language' %}" class="flex overflow-hidden rounded-lg bg-white/10 ring-1 ring-white/15" data-testid="language-switch">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for code, name in LANGUAGES %}
  <button type="submit" name="language" value="{{ code }}" lang="{{ code }}" title="{{ name }}" aria-label="{{ name }}"
          {% if code == current_lang %}aria-pressed="true" class="min-h-[44px] w-10 bg-white text-xs font-bold text-brand-900"{% else %}aria-pressed="false" class="min-h-[44px] w-10 text-xs font-semibold text-white hover:bg-white/20"{% endif %}>{{ code|upper }}</button>
  {% endfor %}
</form>
