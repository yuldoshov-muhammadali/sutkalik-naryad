# Lokal ishga tushirish: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: naryad
      POSTGRES_USER: naryad
      POSTGRES_PASSWORD: naryad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naryad -d naryad"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://naryad:naryad@db:5432/naryad
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-only-docker-compose-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
